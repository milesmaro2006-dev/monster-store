{% extends 'admin/base_admin.html' %}
{% block title %}تغيير كلمة المرور{% endblock %}
{% block content %}
<section class="password-change-panel panel" aria-labelledby="password-change-title">
<form method="post" class="password-change-form">
  {{ form.hidden_tag() }}
  <header>
    <p class="eyebrow">حماية الحساب</p>
    <h1 id="password-change-title">تغيير كلمة المرور</h1>
  </header>
  <p>لأمان حسابك، أنشئ كلمة مرور جديدة لا تقل عن 12 حرفاً.</p>
  <label for="{{ form.current_password.id }}">{{ form.current_password.label }} {{ form.current_password(class="input", autocomplete="current-password", required=True) }}{% for e in form.current_password.errors %}<span class="err">{{ e }}</span>{% endfor %}</label>
  <label for="{{ form.new_password.id }}">{{ form.new_password.label }} {{ form.new_password(class="input", autocomplete="new-password", required=True) }}{% for e in form.new_password.errors %}<span class="err">{{ e }}</span>{% endfor %}</label>
  <label for="{{ form.confirm_password.id }}">{{ form.confirm_password.label }} {{ form.confirm_password(class="input", autocomplete="new-password", required=True) }}{% for e in form.confirm_password.errors %}<span class="err">{{ e }}</span>{% endfor %}</label>
  <button type="submit" class="btn btn-primary btn-block">حفظ كلمة المرور</button>
</form>
</section>
{% endblock %}
