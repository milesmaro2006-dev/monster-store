<!-- Admin base layout -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}لوحة التحكم{% endblock %} — IMPORT DISTRICT</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css', v='20261021-category-management') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css', v='20261021-category-management') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-product-form.css', v='20261022-form-v2') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-flavor-tags.css', v='20261022-1') }}">
</head>
<body>
  {% if current_user.is_authenticated %}
  <button class="mobile-toggle" aria-label="فتح القائمة" aria-controls="admin-nav" aria-expanded="false">☰</button>
  <div class="admin-layout">
    {% include 'admin/_sidebar.html' %}
    <main class="admin-main">
      {% include '_flash.html' %}
      {% block content %}{% endblock %}
    </main>
  </div>
  {% else %}
    {% include '_flash.html' %}
    {% block auth_content %}{% endblock %}
  {% endif %}
  <script src="{{ url_for('static', filename='js/admin.js', v='20261022-flavor-tags') }}"></script>
</body>
</html>
